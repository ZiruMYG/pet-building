<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2faf5">
  <title>芽芽的卧室</title>
  <style>
    :root { color-scheme:light; --ink:#284b52; --muted:#65817c; --green:#368768; --line:#cde3d6; --cream:#fff8e9; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f2faf5; color:var(--ink); font:15px/1.55 ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:3px solid #da9c26; outline-offset:4px; }
    main { max-width:1220px; margin:auto; padding:26px; }
    .heading { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:18px; }
    .eyebrow { margin:0 0 3px; color:var(--green); font-size:12px; font-weight:750; letter-spacing:.08em; }
    h1 { font-size:28px; line-height:1.3; margin:0 0 5px; }
    .heading p:last-child { margin:0; color:var(--muted); font-size:14px; }
    .back-link { color:var(--green); font-weight:750; text-decoration:none; white-space:nowrap; }
    .room-shell { border:2px solid var(--line); border-radius:26px; overflow:hidden; background:#fff; box-shadow:0 6px 0 #e3eee4; }
    .stage { position:relative; background:#fff8e9; isolation:isolate; }
    #out { display:block; width:100%; height:auto; aspect-ratio:16/9; }
    .p5Canvas { display:none !important; }
    .hotspots { position:absolute; inset:0; pointer-events:none; }
    .hotspot { position:absolute; border:2px solid transparent; border-radius:20px; background:transparent; padding:0; min-width:24px; min-height:24px; pointer-events:auto; }
    .hotspot:hover,.hotspot:focus-visible { background:#fff8d71c; border-color:#e3ac53b3; }
    .hotspot-label { position:absolute; left:50%; bottom:100%; transform:translateX(-50%); white-space:nowrap; padding:4px 10px; border:1px solid #dccba3; border-radius:99px; color:#65573e; background:#fffdf3f5; font-size:12px; font-weight:750; opacity:0; pointer-events:none; }
    .hotspot:hover .hotspot-label,.hotspot:focus-visible .hotspot-label { opacity:1; }
    .loading { position:absolute; inset:0; z-index:5; display:grid; place-content:center; gap:8px; text-align:center; color:var(--muted); background:#fff9ec; padding:26px; }
    .loading[hidden] { display:none; }
    .loading strong { font-size:20px; color:var(--ink); }
    .room-status { min-height:76px; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 19px; background:#fffef8; border-top:1px solid #e8ecdf; }
    .status-copy { min-width:0; }
    #phase-label { margin:0; font-weight:750; font-size:15px; }
    #queue-label { margin:3px 0 0; color:var(--muted); font-size:12px; }
    #queue-label[hidden] { display:none; }
    .room-badge { flex-shrink:0; display:flex; gap:6px; align-items:center; padding:5px 10px; border-radius:99px; background:#edf8ee; color:#407158; font-size:12px; font-weight:750; }
    .room-badge::before { content:""; width:6px; height:6px; border-radius:50%; background:#74ae7b; }
    .room-badge.paused { color:#91783f; background:#fbf2da; }
    .room-badge.paused::before { background:#c9ab61; }
    .interactions { margin-top:21px; }
    .section-heading { display:flex; justify-content:space-between; gap:15px; align-items:baseline; margin-bottom:10px; }
    h2 { margin:0; font-size:17px; }
    .section-heading p { margin:0; color:var(--muted); font-size:12px; }
    .commands { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
    .command { min-height:54px; padding:11px 10px; border:2px solid #dbe9dd; border-radius:15px; background:#fff; color:var(--ink); font-weight:750; }
    .command:hover { border-color:#81b394; background:#fbfff8; }
    .command[aria-pressed="true"] { border-color:#72a687; background:#e8f5df; color:#396847; }
    .command .icon { margin-right:6px; }
    .transport { display:flex; flex-wrap:wrap; align-items:center; gap:11px; margin-top:17px; }
    .auto-control { display:flex; align-items:center; gap:9px; min-height:44px; margin-right:auto; font-size:14px; font-weight:750; cursor:pointer; }
    .auto-control input { width:20px; height:20px; accent-color:var(--green); cursor:pointer; }
    .transport button { border:1px solid var(--line); border-radius:12px; padding:9px 14px; min-height:44px; color:var(--green); background:#fff; font-weight:750; }
    .transport button:hover { background:#eaf7ed; }
    .room-note { color:var(--muted); margin:9px 0 0; font-size:12px; }
    .embed main { padding:16px; }
    .embed .heading { display:none; }
    @media(max-width:680px) {
      main { padding:13px; }
      .heading { align-items:flex-start; gap:10px; margin-bottom:14px; }
      h1 { font-size:23px; }
      .heading p:last-child { font-size:12px; }
      .back-link { font-size:12px; padding-top:5px; }
      .room-shell { border-radius:18px; }
      .room-status { padding:11px 12px; gap:8px; min-height:80px; align-items:flex-start; }
      #phase-label { font-size:13px; }
      #queue-label { font-size:11px; }
      .room-badge { font-size:10px; padding:4px 7px; }
      .commands { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
      .command { padding:10px 7px; font-size:13px; min-height:49px; }
      .section-heading { display:block; margin-bottom:9px; }
      .section-heading p { margin-top:3px; }
      .transport { gap:8px; }
      .auto-control { font-size:13px; }
      .transport button { font-size:12px; padding:9px 11px; }
      .hotspot { border-radius:8px; }
      .hotspot-label { font-size:10px; padding:2px 6px; }
      .embed main { padding:10px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; } }
  </style>
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
  <script src="source/vendor/p5.min.js"></script>
  <script src="source/vendor/p5.brush.js"></script>
</head>
<body>
  <main>
    <header class="heading">
      <div><p class="eyebrow">芽芽的小小日常</p><h1>芽芽的卧室</h1><p>阳光、绘本和最喜欢的小熊，都在这里。</p></div>
      <a class="back-link" href="index.html#bedroom-panel">返回芽芽的小世界 ↗</a>
    </header>
    <section class="room-shell" aria-label="芽芽的互动卧室">
      <div class="stage" data-testid="bedroom-stage">
        <canvas id="out" width="1920" height="1080" role="img" aria-label="芽芽在卧室里自由活动"></canvas>
        <div id="room-hotspots" class="hotspots" role="group" aria-label="点选房间里的物品"></div>
        <div class="loading" id="loading" role="status"><strong>芽芽正在收拾小房间…</strong><span>稍等一下，就可以一起玩了</span></div>
      </div>
      <div class="room-status">
        <div class="status-copy" aria-live="polite" aria-atomic="true"><p id="phase-label">芽芽正在准备…</p><p id="queue-label" hidden></p></div>
        <span class="room-badge" id="room-badge">自己玩一会</span>
      </div>
    </section>
    <section class="interactions" aria-labelledby="commands-title">
      <div class="section-heading"><h2 id="commands-title">陪芽芽做点什么</h2><p>也可以直接点房间里的窗、绘本、小熊、灯和床。</p></div>
      <div class="commands" role="group" aria-label="卧室里的活动">
        <button class="command" type="button" data-room-command="window" aria-pressed="false"><span class="icon" aria-hidden="true">🌤️</span>看看窗外</button>
        <button class="command" type="button" data-room-command="read" aria-pressed="false"><span class="icon" aria-hidden="true">📖</span>看绘本</button>
        <button class="command" type="button" data-room-command="teddy" aria-pressed="false"><span class="icon" aria-hidden="true">🧸</span>抱抱小熊</button>
        <button class="command" type="button" data-room-command="tidy" aria-pressed="false"><span class="icon" aria-hidden="true">🧺</span>检查小柜子</button>
        <button class="command" type="button" data-room-command="lamp" aria-pressed="false"><span class="icon" aria-hidden="true">💡</span>开关床头灯</button>
        <button class="command" type="button" data-room-command="sleep" aria-pressed="false"><span class="icon" aria-hidden="true">🌙</span>上床睡一会</button>
        <button class="command" type="button" data-room-command="wander" aria-pressed="false"><span class="icon" aria-hidden="true">🐾</span>在房间散步</button>
      </div>
    </section>
    <div class="transport" aria-label="卧室活动控制">
      <label class="auto-control"><input id="auto-life" type="checkbox" checked>让芽芽自己安排</label>
      <button type="button" id="play-toggle" aria-pressed="false">Ⅱ 暂停</button>
      <button type="button" id="restart">↺ 重新开始</button>
    </div>
    <p class="room-note" id="room-note">芽芽会自己走到物品旁边。换活动时，会先做好手上的取放，再去做下一件事。</p>
  </main>
  <script src="source/config-yaya-pet.js"></script>
  <script src="source/core.js"></script>
  <script src="source/timeline.js"></script>
  <script src="source/yaya-turns.js"></script>
  <script src="source/yaya-actions.js"></script>
  <script src="source/yaya-rig.js"></script>
  <script src="source/yaya-body.js"></script>
  <script src="source/yaya-gait.js"></script>
  <script src="source/yaya-leaves.js"></script>
  <script src="source/yaya-pet.js"></script>
  <script src="source/yaya-views.js"></script>
  <script src="source/yaya-scenes.js"></script>
  <script src="source/yaya-bedroom-art.js"></script>
  <script src="source/yaya-bedroom-model.js"></script>
  <script src="source/yaya-bedroom.js"></script>
  <script src="source/yaya-bedroom-ui.js"></script>
</body>
</html>
