<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0fbf6">
  <title>芽芽 · 三视图与动作实验室</title>
  <style>
    :root { color-scheme:light; --ink:#183e59; --soft:#50778b; --green:#208b68; --line:#c5e8de; --yellow:#ffdb66; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f0fbf6; color:var(--ink); font:15px/1.5 ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    button,input { font:inherit; }
    button { min-height:44px; padding:9px 16px; border:2px solid var(--line); border-radius:14px; color:var(--ink); background:#fff; font-weight:750; cursor:pointer; }
    button:hover { border-color:var(--green); background:#f4fff8; }
    button[aria-pressed="true"] { border-color:#be941f; background:var(--yellow); color:#644909; }
    button:focus-visible,input:focus-visible,a:focus-visible { outline:3px solid #eea518; outline-offset:3px; }
    main { max-width:1180px; padding:24px; margin:auto; }
    .heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:20px; }
    h1 { margin:0 0 4px; font-size:25px; line-height:1.3; }
    .heading p { margin:0; color:var(--soft); font-size:14px; }
    .back-link { flex-shrink:0; color:var(--green); font-weight:750; text-decoration:none; }
    .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-bottom:12px; }
    .toolbar-label { font-size:13px; font-weight:800; color:var(--soft); margin-right:3px; }
    .view-button { padding:7px 13px; min-height:40px; font-size:13px; border-color:#c8e5ec; }
    .view-button[aria-pressed="true"] { background:#e0f6ff; border-color:#5cabc9; color:#245d76; }
    .action-button .icon { margin-right:5px; }
    .stage { position:relative; overflow:hidden; border:2px solid #b5ded5; background:#f6fcff; border-radius:24px; box-shadow:0 5px 0 #dfeee7; }
    #out { display:block; width:100%; height:auto; aspect-ratio:16/9; }
    .p5Canvas { display:none !important; }
    .view-labels { position:absolute; left:0; right:0; bottom:4%; display:grid; grid-template-columns:repeat(3,1fr); text-align:center; pointer-events:none; color:#527285; font-weight:750; font-size:13px; }
    .view-labels.single { grid-template-columns:1fr; }
    .stage-state { position:absolute; top:15px; left:16px; border:1px solid #c5e8de; background:#ffffffed; color:#246f54; border-radius:99px; padding:5px 11px; font-size:12px; font-weight:750; }
    .loading { position:absolute; inset:0; display:grid; place-content:center; gap:8px; text-align:center; background:#f4fcf8; color:var(--soft); padding:30px; }
    .loading[hidden] { display:none; }
    .loading strong { font-size:18px; color:var(--ink); }
    .transport { margin-top:17px; display:flex; align-items:center; gap:10px; }
    .transport button { flex-shrink:0; padding:8px 14px; min-width:76px; }
    #scrub { flex:1; min-width:60px; accent-color:var(--green); cursor:pointer; }
    #tt { font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--soft); }
    .bottom-row { margin-top:13px; display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
    .description { margin:0; color:var(--soft); font-size:13px; }
    .debug-control { white-space:nowrap; display:flex; align-items:center; gap:7px; font-size:13px; color:#3d677a; cursor:pointer; min-height:30px; }
    .debug-control input { width:18px; height:18px; accent-color:var(--green); }
    .legend { margin-top:8px; color:#427685; font-size:12px; }
    .legend[hidden] { display:none; }
    .embed main { padding:16px; }
    .embed .heading { display:none; }
    @media(max-width:680px) {
      main { padding:14px; }
      .heading { align-items:flex-start; gap:12px; }
      h1 { font-size:21px; }
      .heading p { font-size:12px; }
      .back-link { font-size:12px; }
      .toolbar { gap:6px; }
      .toolbar-label { width:100%; margin-bottom:0; }
      button { padding:8px 11px; font-size:13px; }
      .view-button { padding:7px 10px; }
      .stage { border-radius:17px; }
      .stage-state { top:8px; left:9px; font-size:10px; padding:3px 7px; }
      .view-labels { font-size:10px; bottom:3%; }
      .transport { gap:7px; flex-wrap:wrap; }
      .transport button { min-width:66px; }
      #tt { min-width:72px; text-align:right; }
      .bottom-row { display:block; }
      .debug-control { margin-top:8px; }
    }
  </style>
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
  <script src="source/vendor/p5.min.js"></script>
  <script src="source/vendor/p5.brush.js"></script>
</head>
<body>
  <main>
    <header class="heading">
      <div><h1>芽芽 · 三视图与动作实验室</h1><p>看清正面、侧面与背面，再观察每一个动作。</p></div>
      <a class="back-link" href="index.html#rig-lab">返回小花园 ↗</a>
    </header>
    <div class="toolbar" role="group" aria-label="选择动作">
      <span class="toolbar-label">做什么</span>
      <button class="action-button" data-lab-action="idle" aria-pressed="true"><span class="icon" aria-hidden="true">🌱</span>站好</button>
      <button class="action-button" data-lab-action="eat" aria-pressed="false"><span class="icon" aria-hidden="true">🥄</span>吃饭</button>
      <button class="action-button" data-lab-action="drink" aria-pressed="false"><span class="icon" aria-hidden="true">💧</span>喝水</button>
      <button class="action-button" data-lab-action="stretch" aria-pressed="false"><span class="icon" aria-hidden="true">🙆</span>伸懒腰</button>
      <button class="action-button" data-lab-action="run" aria-pressed="false"><span class="icon" aria-hidden="true">🏃</span>往返小跑</button>
    </div>
    <div class="toolbar" role="group" aria-label="选择观察视角">
      <span class="toolbar-label">怎么看</span>
      <button class="view-button" data-lab-view="sheet" aria-pressed="true">三视图一起看</button>
      <button class="view-button" data-lab-view="front" aria-pressed="false">正面</button>
      <button class="view-button" data-lab-view="side" aria-pressed="false">侧面</button>
      <button class="view-button" data-lab-view="back" aria-pressed="false">背面</button>
      <button class="view-button" data-lab-view="travel" aria-pressed="false">往返跑道</button>
    </div>
    <div class="stage" data-testid="rig-stage">
      <canvas id="out" width="1920" height="1080" role="img" aria-label="芽芽的正面、侧面、背面三视图"></canvas>
      <div class="stage-state" id="phase-label">三视图 · 站好</div>
      <div class="view-labels" id="view-labels"><span>正面</span><span>侧面</span><span>背面</span></div>
      <div class="loading" id="loading" role="status"><strong>芽芽正在准备…</strong><span>加载本地绘制程序</span></div>
    </div>
    <div class="transport" aria-label="动画播放控制">
      <button type="button" id="play-toggle" aria-pressed="false">Ⅱ 暂停</button>
      <button type="button" id="restart">↺ 重播</button>
      <input id="scrub" type="range" min="0" max="4" step="0.01" value="0" aria-label="逐帧查看动作进度">
      <output id="tt" for="scrub">0.00 / 4.00s</output>
    </div>
    <div class="bottom-row">
      <p class="description" id="action-description">先看同一个芽芽的三个角度。点选动作，可以同时对照手臂与身体的关系。</p>
      <label class="debug-control"><input id="show-rig" type="checkbox">显示骨架与肩点</label>
    </div>
    <p class="legend" id="rig-legend" hidden>肩点固定在身体两侧；连线显示手掌与手臂的连接。拖动进度条可以检查动作中间帧。</p>
  </main>
  <script src="source/config-yaya-pet.js"></script>
  <script src="source/core.js"></script>
  <script src="source/timeline.js"></script>
  <script src="source/yaya-rig.js"></script>
  <script src="source/yaya-body.js"></script>
  <script src="source/yaya-gait.js"></script>
  <script src="source/yaya-pet.js"></script>
  <script src="source/yaya-views.js"></script>
  <script src="source/yaya-rig-lab.js"></script>
</body>
</html>
