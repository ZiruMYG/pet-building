<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Yaya electronic pet studio</title>
<style>
  html, body { margin: 0; background: #2b2430; color: #fff4de; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #fbf1da; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; accent-color: #83c985; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="vendor/p5.min.js"></script>
<script src="vendor/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="16" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script src="config-yaya-pet.js"></script>
<script src="core.js"></script>
<script src="timeline.js"></script>
<script src="yaya-rig.js"></script>
<script src="yaya-body.js"></script>
<script src="yaya-gait.js"></script>
<script src="yaya-leaves.js"></script>
<script src="yaya-pet.js"></script>
<script src="yaya-views.js"></script>
<script src="yaya-pet-demo.js"></script>
</body>
</html>
