<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Building · 猫熊企鹅原型</title>
  <style>
    :root { --ink:#183654; --blue:#e9f7ff; --blue-2:#bceafa; --yellow:#ffd55b; --muted:#64839c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:linear-gradient(180deg,#f8fdff 0%,#e9f8ff 55%,#fff9ec 100%); }
    .page { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:34px 0 48px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(1.6rem,3vw,2.35rem); letter-spacing:.02em; }
    header p { margin:8px 0 0; color:var(--muted); font-size:.94rem; }
    .legend { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; color:#47718d; font-size:.78rem; }
    .legend span { padding:7px 11px; background:#fff; border:2px solid #c9eaf7; border-radius:999px; }
    .prototype-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .card { overflow:hidden; background:rgba(255,255,255,.86); border:3px solid #a7dcf2; border-radius:28px; box-shadow:0 9px 0 rgba(33,112,151,.09); }
    .card-head { display:flex; justify-content:space-between; align-items:center; padding:17px 18px 12px; }
    .card-head h2 { margin:0; font-size:1.14rem; }
    .card-head small { color:var(--muted); }
    .stage { margin:0 14px; min-height:370px; border-radius:22px; display:grid; place-items:center; background:radial-gradient(circle at 50% 22%,#fff 0 32%,#edfaff 72%); border:2px solid #d1eff9; position:relative; }
    .stage::after { content:""; position:absolute; width:76%; height:28px; bottom:22px; border-radius:50%; background:rgba(91,161,190,.12); filter:blur(2px); }
    .stage svg { width:min(100%,350px); height:auto; position:relative; z-index:1; }
    .states { display:flex; gap:7px; padding:14px 14px 16px; }
    .states button { flex:1; min-height:38px; border:2px solid #b4e1f1; background:#f6fcff; color:#28617f; border-radius:13px; font:inherit; font-size:.8rem; font-weight:750; cursor:pointer; transition:.16s ease; }
    .states button:hover { transform:translateY(-2px); border-color:#4ba9cf; }
    .states button[aria-pressed="true"] { background:var(--yellow); color:#634a00; border-color:#d29a17; box-shadow:inset 0 -3px 0 rgba(145,98,0,.15); }
    .note { margin-top:20px; padding:18px 20px; border:2px solid #f1d589; border-radius:22px; background:#fffdf1; color:#6f5b28; }
    .note strong { color:#55400c; }
    .note p { margin:6px 0 0; line-height:1.65; font-size:.9rem; }
    .pet-svg .outline { stroke:#183654; stroke-width:7; stroke-linejoin:round; stroke-linecap:round; }
    .pet-svg .detail { stroke:#183654; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; fill:none; }
    .pet-svg .soft { animation:breathe 2.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom; }
    .pet-svg .blink { animation:blink 4.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .pet-svg .arm { transition:transform .28s ease; transform-box:fill-box; transform-origin:top center; }
    .pet-svg .shine { animation:shine 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{transform:translateY(0) scaleY(1)} 50%{transform:translateY(-3px) scaleY(1.012)} }
    @keyframes blink { 0%,42%,48%,100%{transform:scaleY(1)} 45%{transform:scaleY(.14)} }
    @keyframes shine { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }
    @media (max-width:900px) { .prototype-grid { grid-template-columns:1fr; max-width:530px; margin:0 auto; } header { display:block; } .legend { justify-content:flex-start; margin-top:14px; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div><h1>猫 · 熊 · 企鹅</h1><p>先看绘制效果：统一轮廓语言，少量状态，保留后续动画空间。</p></div>
      <div class="legend"><span>明亮卡通</span><span>粗清晰线条</span><span>短臂固定根部</span></div>
    </header>
    <section id="prototypeGrid" class="prototype-grid" aria-label="宠物原型展示"></section>
    <aside class="note"><strong>这版先验证三件事：</strong><p>身体轮廓是否一眼可认、眼睛和嘴巴能否读出情绪、短手从身体两侧抬起时是否自然。每个角色只保留「平静、开心、惊讶」三个状态，方便先评估造型。</p></aside>
  </main>
  <script>
    const states = [
      { key:'neutral', label:'平静' },
      { key:'happy', label:'开心' },
      { key:'surprised', label:'惊讶' }
    ];
    const pets = [
      { key:'cat', name:'猫', sub:'橘猫 · 软耳朵', color:'#f5a63c' },
      { key:'bear', name:'熊', sub:'蜂蜜棕 · 大肚肚', color:'#b87432' },
      { key:'penguin', name:'企鹅', sub:'蓝黑 · 小围巾', color:'#29456a' }
    ];
    const selected = Object.fromEntries(pets.map(p=>[p.key,'neutral']));

    function eye(x,y,mode,scale=1) {
      if (mode==='happy') return `<path class="detail" d="M${x-13*scale} ${y} Q${x} ${y+14*scale} ${x+13*scale} ${y}"/>`;
      if (mode==='surprised') return `<ellipse class="outline blink" cx="${x}" cy="${y}" rx="15" ry="20" fill="#fff"/><ellipse cx="${x}" cy="${y+2}" rx="7" ry="11" fill="#203653"/><circle cx="${x-3}" cy="${y-3}" r="3.6" fill="#fff"/>`;
      return `<ellipse class="outline blink" cx="${x}" cy="${y}" rx="13" ry="18" fill="#fff"/><ellipse cx="${x}" cy="${y+2}" rx="6.5" ry="10" fill="#203653"/><circle cx="${x-3}" cy="${y-4}" r="3.5" fill="#fff"/>`;
    }
    function mouth(cx,cy,mode,kind='small') {
      if (mode==='happy') return `<path d="M${cx-15} ${cy} Q${cx} ${cy+22} ${cx+15} ${cy}" fill="#f47d72" class="outline"/><path d="M${cx-9} ${cy+11} Q${cx} ${cy+17} ${cx+9} ${cy+11}" fill="none" stroke="#a84852" stroke-width="3" stroke-linecap="round"/>`;
      if (mode==='surprised') return `<ellipse class="outline" cx="${cx}" cy="${cy+6}" rx="11" ry="16" fill="#f47d72"/>`;
      return `<path class="detail" d="M${cx-11} ${cy} Q${cx} ${cy+9} ${cx+11} ${cy}"/>`;
    }
    function arm(x,y,tx,ty,fill,paw,state,flip=1) {
      const rot = state==='happy' ? -18*flip : state==='surprised' ? -28*flip : 0;
      return `<g class="arm" transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 C${10*flip} 7 ${18*flip} 18 ${tx-x} ${ty-y}" fill="none" stroke="${fill}" stroke-width="25" stroke-linecap="round"/><circle cx="${tx-x}" cy="${ty-y}" r="16" fill="${paw}" class="outline"/></g>`;
    }
    function cat(state) {
      const paws = state==='surprised' ? {l:[120,183],r:[240,183]} : state==='happy' ? {l:[101,211],r:[259,211]} : {l:[92,256],r:[268,256]};
      return `<svg class="pet-svg" viewBox="0 0 360 400" role="img" aria-label="猫的${states.find(s=>s.key===state).label}状态">
        <g class="soft">
          <path d="M79 128 L71 50 Q72 33 90 42 L129 66 Q180 42 231 66 L270 42 Q288 33 289 50 L281 128Z" fill="#f5a63c" class="outline"/>
          <path d="M83 70 L86 53 L112 69" fill="#f7a5a8" class="outline" stroke-width="4"/><path d="M277 70 L274 53 L248 69" fill="#f7a5a8" class="outline" stroke-width="4"/>
          <path d="M91 111 Q180 70 269 111 Q294 129 286 244 Q280 314 180 322 Q80 314 74 244 Q66 129 91 111Z" fill="#f5a63c" class="outline"/>
          <path d="M102 177 Q180 143 258 177 L253 287 Q180 313 107 287Z" fill="#fff4de" class="outline" stroke-width="5"/>
          <path d="M136 94 l-10 23 M157 88 l-4 25 M180 86 v26 M203 88 l4 25 M224 94 l10 23" class="detail" stroke="#c46f29" stroke-width="8"/>
          <ellipse cx="111" cy="174" rx="19" ry="10" fill="#f58f85" opacity=".7"/><ellipse cx="249" cy="174" rx="19" ry="10" fill="#f58f85" opacity=".7"/>
          ${eye(140,151,state)}${eye(220,151,state)}
          <path d="M172 171 Q180 166 188 171 L180 179Z" fill="#ee7b79" class="outline" stroke-width="3"/>${mouth(180,191,state)}
          ${arm(92,256,paws.l[0],paws.l[1],'#f5a63c','#fff4de',state,-1)}${arm(268,256,paws.r[0],paws.r[1],'#f5a63c','#fff4de',state,1)}
          <path d="M86 293 Q53 278 58 249 Q63 231 81 242 Q98 254 105 270" fill="none" stroke="#f5a63c" stroke-width="24" stroke-linecap="round" class="outline"/>
          <path d="M132 315 Q120 342 144 346 M228 315 Q240 342 216 346" fill="none" stroke="#f5a63c" stroke-width="24" stroke-linecap="round" class="outline"/>
          ${state==='surprised'?'<path class="shine" d="M55 154 l-16 -8 M305 154 l16 -8" stroke="#f5b52f" stroke-width="7" stroke-linecap="round"/>':''}
        </g></svg>`;
    }
    function bear(state) {
      const paws = state==='surprised' ? {l:[120,190],r:[240,190]} : state==='happy' ? {l:[121,219],r:[239,219]} : {l:[91,258],r:[269,258]};
      return `<svg class="pet-svg" viewBox="0 0 360 400" role="img" aria-label="熊的${states.find(s=>s.key===state).label}状态">
        <g class="soft">
          <circle cx="100" cy="99" r="40" fill="#b87432" class="outline"/><circle cx="260" cy="99" r="40" fill="#b87432" class="outline"/><circle cx="100" cy="99" r="20" fill="#f5c37a"/><circle cx="260" cy="99" r="20" fill="#f5c37a"/>
          <path d="M180 65 Q278 65 288 163 L282 278 Q270 323 180 328 Q90 323 78 278 L72 163 Q82 65 180 65Z" fill="#b87432" class="outline"/>
          <ellipse cx="180" cy="244" rx="71" ry="61" fill="#f5c37a" class="outline" stroke-width="5"/>
          <ellipse cx="180" cy="158" rx="69" ry="54" fill="#c88742" opacity=".72"/>
          ${eye(143,147,state)}${eye(217,147,state)}
          <ellipse cx="180" cy="169" rx="18" ry="13" fill="#5a352c" class="outline" stroke-width="4"/>${mouth(180,188,state)}
          <ellipse cx="117" cy="176" rx="18" ry="10" fill="#ee9675" opacity=".75"/><ellipse cx="243" cy="176" rx="18" ry="10" fill="#ee9675" opacity=".75"/>
          ${arm(91,258,paws.l[0],paws.l[1],'#b87432','#c88742',state,-1)}${arm(269,258,paws.r[0],paws.r[1],'#b87432','#c88742',state,1)}
          <path d="M131 311 Q120 345 148 347 M229 311 Q240 345 212 347" fill="none" stroke="#b87432" stroke-width="28" stroke-linecap="round" class="outline"/>
          ${state==='happy'?'<path class="shine" d="M58 152 l-14 -10 M302 152 l14 -10" stroke="#f5b52f" stroke-width="7" stroke-linecap="round"/>':''}
        </g></svg>`;
    }
    function penguin(state) {
      const paws = state==='surprised' ? {l:[121,191],r:[239,191]} : state==='happy' ? {l:[103,221],r:[257,221]} : {l:[88,264],r:[272,264]};
      return `<svg class="pet-svg" viewBox="0 0 360 400" role="img" aria-label="企鹅的${states.find(s=>s.key===state).label}状态">
        <g class="soft">
          <path d="M180 57 Q273 58 282 175 L274 292 Q253 329 180 331 Q107 329 86 292 L78 175 Q87 58 180 57Z" fill="#29456a" class="outline"/>
          <path d="M101 105 Q180 67 259 105 Q267 151 252 252 Q236 292 180 298 Q124 292 108 252 Q93 151 101 105Z" fill="#fff5df" class="outline" stroke-width="5"/>
          <path d="M133 84 Q180 67 227 84" class="detail" stroke="#8ebde1" stroke-width="8"/>
          ${eye(145,149,state)}${eye(215,149,state)}
          <path d="M164 174 Q180 162 196 174 L180 190Z" fill="#f6a83d" class="outline" stroke-width="4"/>${state==='happy'?'<path d="M165 190 Q180 212 195 190" fill="#f47d72" class="outline"/>':mouth(180,203,state)}
          <path d="M116 236 Q180 256 244 236 L242 278 Q180 300 118 278Z" fill="#65bce8" class="outline" stroke-width="5"/>
          <path d="M217 244 L233 288" stroke="#d8f1ff" stroke-width="5" stroke-linecap="round"/>
          ${arm(88,264,paws.l[0],paws.l[1],'#29456a','#29456a',state,-1)}${arm(272,264,paws.r[0],paws.r[1],'#29456a','#29456a',state,1)}
          <path d="M132 309 Q116 339 148 342 M228 309 Q244 339 212 342" fill="none" stroke="#f6a83d" stroke-width="25" stroke-linecap="round" class="outline"/>
          ${state==='surprised'?'<path class="shine" d="M55 158 l-14 -8 M305 158 l14 -8" stroke="#7fc9ef" stroke-width="7" stroke-linecap="round"/>':''}
        </g></svg>`;
    }
    function drawing(type,state) { return type==='cat'?cat(state):type==='bear'?bear(state):penguin(state); }
    function renderCard(pet) {
      const card=document.createElement('article'); card.className='card'; card.innerHTML=`<div class="card-head"><div><h2>${pet.name}</h2><small>${pet.sub}</small></div><span style="width:14px;height:14px;border-radius:50%;background:${pet.color};border:2px solid #183654"></span></div><div class="stage" data-stage="${pet.key}">${drawing(pet.key,selected[pet.key])}</div><div class="states" role="group" aria-label="${pet.name}的状态选择">${states.map(s=>`<button type="button" data-state="${s.key}" aria-pressed="${s.key===selected[pet.key]}">${s.label}</button>`).join('')}</div>`;
      card.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{ selected[pet.key]=btn.dataset.state; card.querySelector(`[data-stage="${pet.key}"]`).innerHTML=drawing(pet.key,selected[pet.key]); card.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn))); }));
      return card;
    }
    const grid=document.querySelector('#prototypeGrid'); pets.forEach(p=>grid.appendChild(renderCard(p)));
  </script>
</body>
</html>
